name: Supabase keep-alive

# Supabase Free pauses a project after ~7 days of inactivity. A daily read
# resets that clock. Uses the anon key (public-safe, RLS-gated) via repo
# secrets so no JWT is committed.
#
# Setup: add two repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       e.g. https://bcteqxzaggisegofxzqm.supabase.co
#   SUPABASE_ANON_KEY  the anon (public) key
#
# If a run fails with HTTP 401, the anon role lacks SELECT on `events`:
# either add an anon SELECT policy, or swap the secret to the service_role key.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repo commits.
# Any push re-arms it; the manual "Run workflow" button (workflow_dispatch) also
# keeps it reachable.

on:
  schedule:
    - cron: "37 7 * * *" # daily 07:37 UTC (off the :00 congestion window)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query events table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sSf \
            "${SUPABASE_URL}/rest/v1/events?select=session_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
